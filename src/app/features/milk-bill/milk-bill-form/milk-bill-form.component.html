<div class="bill-form">
  <h1>Log today's milk bill</h1>

  <section class="image-capture">
    @if (imagePreviewUrl(); as src) {
    <img class="preview" [src]="src" alt="Captured milk bill" />
    <button type="button" class="secondary" (click)="clearImage()">Retake / Remove</button>
    } @else {
    <label class="capture-label">
      <input type="file" accept="image/*" capture="environment" (change)="onImageSelected($event)" />
      <span>📷 Scan / Upload bill photo</span>
    </label>
    }
  </section>

  <form class="fields" (ngSubmit)="save()">
    <label>
      Bill date
      <input type="date" [ngModel]="billDate()" (ngModelChange)="updateBillDate($event)" name="billDate" required />
    </label>

    <div class="shift-selector">
      <span class="shift-label">Session</span>
      <div class="shift-toggle" role="group" aria-label="Session">
        <button
          type="button"
          id="shift-morning"
          class="shift-btn"
          [class.active]="shift() === 'Morning'"
          (click)="updateShift('Morning')">
          🌅 Morning
        </button>
        <button
          type="button"
          id="shift-evening"
          class="shift-btn"
          [class.active]="shift() === 'Evening'"
          (click)="updateShift('Evening')">
          🌆 Evening
        </button>
      </div>
    </div>

    <label>
      Quantity (liters)
      <input type="number" inputmode="decimal" step="0.1" min="0" placeholder="e.g. 1.5" [ngModel]="quantityLiters()"
        (ngModelChange)="updateQuantity($event)" name="quantityLiters" required />
    </label>

    <label>
      Rate per liter (₹)
      <input type="number" inputmode="decimal" step="0.01" min="0" placeholder="e.g. 62" [ngModel]="ratePerLiter()"
        (ngModelChange)="updateRate($event)" name="ratePerLiter" required />
    </label>

    <label>
      Total amount (₹)
      <input type="number" inputmode="decimal" step="0.01" min="0"
        [placeholder]="computedTotal() !== null ? computedTotal()!.toString() : 'Auto-calculated'"
        [ngModel]="totalAmountOverride()" (ngModelChange)="onTotalOverrideChange($event)" name="totalAmount" />
      @if (computedTotal() !== null && totalAmountOverride() === null) {
      <small>Auto-calculated: ₹{{ computedTotal() }}</small>
      }
    </label>

    <label>
      Vendor name <span class="optional">(optional)</span>
      <input type="text" placeholder="e.g. Aavin, local dairy" [ngModel]="vendorName()"
        (ngModelChange)="updateVendorName($event)" name="vendorName" />
    </label>

    <div class="row">
      <label>
        FAT % <span class="optional">(optional)</span>
        <input type="number" inputmode="decimal" step="0.01" min="0" placeholder="e.g. 4.9" [ngModel]="fatPercent()"
          (ngModelChange)="updateFatPercent($event)" name="fatPercent" />
      </label>

      <label>
        SNF % <span class="optional">(optional)</span>
        <input type="number" inputmode="decimal" step="0.01" min="0" placeholder="e.g. 7.8" [ngModel]="snfPercent()"
          (ngModelChange)="updateSnfPercent($event)" name="snfPercent" />
      </label>
    </div>

    <div class="row">
      <label>
        Member code <span class="optional">(optional)</span>
        <input type="text" placeholder="e.g. 031 CM" [ngModel]="memberCode()"
          (ngModelChange)="updateMemberCode($event)" name="memberCode" />
      </label>

      <label>
        Member name <span class="optional">(optional)</span>
        <input type="text" placeholder="e.g. Murugan" [ngModel]="memberName()"
          (ngModelChange)="updateMemberName($event)" name="memberName" />
      </label>
    </div>

    <label>
      Notes <span class="optional">(optional)</span>
      <textarea rows="2" placeholder="Anything worth remembering about this bill" [ngModel]="notes()"
        (ngModelChange)="notes.set($event)" name="notes"></textarea>
    </label>

    @if (errorMessage(); as msg) {
    <p class="error">{{ msg }}</p>
    }

    <button type="submit" class="primary" [disabled]="!canSave() || isSaving()">
      {{ isSaving() ? 'Saving…' : 'Save bill' }}
    </button>
  </form>
</div>
