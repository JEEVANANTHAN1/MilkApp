<div class="login-page">
  <!-- Background blobs -->
  <div class="blob blob--1"></div>
  <div class="blob blob--2"></div>
  <div class="blob blob--3"></div>

  <div class="login-card">

    <!-- Brand -->
    <div class="brand">
      <div class="brand__logo-wrap">
        <img src="logo.jpg" alt="Milk Flow logo" class="brand__logo" />
      </div>
      <h1 class="brand__name">Milk Flow</h1>
      <p class="brand__tagline">Your milk collection, organised.</p>
    </div>

    <!-- Success banner -->
    @if (successMessage()) {
      <div class="alert alert--success" role="status">
        <span class="material-symbols-outlined">check_circle</span>
        {{ successMessage() }}
      </div>
    }

    <!-- Error banner -->
    @if (errorMessage()) {
      <div class="alert alert--error" role="alert">
        <span class="material-symbols-outlined">error</span>
        {{ errorMessage() }}
      </div>
    }

    <!-- Google Login Button -->
    <button
      type="button"
      class="google-btn"
      (click)="loginWithGoogle()"
      aria-label="Continue with Google">
      <svg class="google-btn__icon" viewBox="0 0 24 24" width="20" height="20">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.1c-.22-.66-.35-1.36-.35-2.1s.13-1.44.35-2.1V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.62z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
      </svg>
      <span>Continue with Google</span>
    </button>

    <div class="divider">
      <span class="divider__text">or sign in with mobile</span>
    </div>

    <!-- Mobile Login / Register Tabs -->
    <div class="tabs" role="tablist">
      <button
        id="tab-login"
        role="tab"
        [attr.aria-selected]="isLogin"
        class="tabs__tab"
        [class.tabs__tab--active]="isLogin"
        (click)="switchMode('login')">
        Sign In
      </button>
      <button
        id="tab-register"
        role="tab"
        [attr.aria-selected]="isRegister"
        class="tabs__tab"
        [class.tabs__tab--active]="isRegister"
        (click)="switchMode('register')">
        Create Account
      </button>
    </div>

    <!-- Form -->
    <form class="form" (ngSubmit)="submit()" autocomplete="on">

      <!-- Mobile Number -->
      <div class="field">
        <label class="field__label" for="mobile-input">Mobile Number</label>
        <div class="field__input-wrap">
          <span class="field__icon material-symbols-outlined">phone</span>
          <input
            id="mobile-input"
            class="field__input"
            type="tel"
            inputmode="tel"
            autocomplete="tel"
            placeholder="e.g. 9876543210"
            [value]="mobileNumber()"
            (input)="onMobileInput($event)"
            required
            aria-label="Mobile number" />
        </div>
      </div>

      <!-- Password -->
      <div class="field">
        <label class="field__label" for="password-input">Password</label>
        <div class="field__input-wrap">
          <span class="field__icon material-symbols-outlined">lock</span>
          <input
            id="password-input"
            class="field__input field__input--password"
            [type]="showPassword() ? 'text' : 'password'"
            autocomplete="{{ isLogin ? 'current-password' : 'new-password' }}"
            placeholder="Enter password"
            [value]="password()"
            (input)="password.set($any($event.target).value)"
            required
            aria-label="Password" />
          <button
            type="button"
            class="field__toggle"
            (click)="togglePassword()"
            [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'">
            <span class="material-symbols-outlined">{{ showPassword() ? 'visibility_off' : 'visibility' }}</span>
          </button>
        </div>
      </div>

      <!-- Confirm Password (register only) -->
      @if (isRegister) {
        <div class="field">
          <label class="field__label" for="confirm-password-input">Confirm Password</label>
          <div class="field__input-wrap">
            <span class="field__icon material-symbols-outlined">lock_reset</span>
            <input
              id="confirm-password-input"
              class="field__input field__input--password"
              [type]="showPassword() ? 'text' : 'password'"
              autocomplete="new-password"
              placeholder="Re-enter password"
              [value]="confirmPassword()"
              (input)="confirmPassword.set($any($event.target).value)"
              required
              aria-label="Confirm password" />
          </div>
        </div>
      }

      <!-- Submit Button -->
      <button
        id="auth-submit-btn"
        type="submit"
        class="submit-btn"
        [class.submit-btn--loading]="submitting()"
        [disabled]="submitting()">
        @if (submitting()) {
          <span class="spinner"></span>
          <span>{{ isLogin ? 'Signing in…' : 'Creating account…' }}</span>
        } @else {
          <span class="material-symbols-outlined">{{ isLogin ? 'login' : 'person_add' }}</span>
          <span>{{ isLogin ? 'Sign In' : 'Create Account' }}</span>
        }
      </button>

    </form>

    <p class="footer-hint">
      Milk Flow &copy; {{ currentYear }}
    </p>
  </div>
</div>
