<div class="loading-overlay" [class.loading-overlay--error]="milkBillService.errorMessage()">
  <div class="loading-container">

    <!-- App Logo with subtle pulse ring -->
    <div class="logo-wrapper">
      <div class="pulse-ring"></div>
      <div class="pulse-ring pulse-ring--delayed"></div>
      <img src="logo.jpg" alt="Milk Flow Logo" class="app-logo" />
    </div>

    @if (milkBillService.errorMessage(); as errorMsg) {
    <div class="error-card">
      <p class="error-card__msg">{{ errorMsg }}</p>
      <div class="error-card__actions">
        <button class="btn btn--primary" (click)="retry()">Retry</button>
        <button class="btn btn--secondary" (click)="continueOffline()">Offline</button>
      </div>
    </div>
    } @else {
    <!-- Minimal Spinner -->
    <!-- <div class="spinner" aria-label="Loading"></div> -->
    }

  </div>
</div>
